<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive instruction explorer for Apple Silicon M1/A14 CPU - search and compare ARM64 instructions">
    <title>Instruction Explorer - Apple CPU Research</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <style>
        /* Explorer-specific styles */
        .explorer-container {
            max-width: 1400px;
            margin: 100px auto 0;
            padding: 0 var(--spacing-lg) var(--spacing-3xl);
        }

        .explorer-header {
            text-align: center;
            margin-bottom: var(--spacing-3xl);
        }

        .explorer-title {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: var(--spacing-md);
        }

        .search-controls {
            background: var(--bg-secondary);
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-xl);
            box-shadow: var(--shadow-md);
        }

        .search-box {
            position: relative;
            margin-bottom: var(--spacing-lg);
        }

        .search-input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-md) var(--spacing-md) 50px;
            font-size: 1.125rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all var(--transition-base);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: var(--text-tertiary);
        }

        .filter-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .filter-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-select {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: border-color var(--transition-fast);
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .results-count {
            font-size: 1.125rem;
            color: var(--text-secondary);
        }

        .view-toggle {
            display: flex;
            gap: var(--spacing-sm);
        }

        .view-btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .view-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .instructions-table {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg-secondary);
        }

        th {
            padding: var(--spacing-md);
            text-align: left;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background-color var(--transition-fast);
        }

        th:hover {
            background: var(--bg-tertiary);
        }

        th::after {
            content: '⇅';
            position: absolute;
            right: var(--spacing-md);
            opacity: 0.3;
        }

        th.sort-asc::after {
            content: '↑';
            opacity: 1;
        }

        th.sort-desc::after {
            content: '↓';
            opacity: 1;
        }

        td {
            padding: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }

        tbody tr {
            transition: background-color var(--transition-fast);
        }

        tbody tr:hover {
            background: var(--bg-secondary);
        }

        .instruction-name {
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--accent-primary);
        }

        .performance-badge {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 600;
        }

        .perf-excellent {
            background: rgba(40, 167, 69, 0.1);
            color: var(--success);
        }

        .perf-good {
            background: rgba(23, 162, 184, 0.1);
            color: var(--info);
        }

        .perf-moderate {
            background: rgba(255, 193, 7, 0.1);
            color: var(--warning);
        }

        .perf-slow {
            background: rgba(220, 53, 69, 0.1);
            color: var(--error);
        }

        .comparison-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-xl);
        }

        .arch-column {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .arch-column-header {
            padding: var(--spacing-lg);
            color: white;
            text-align: center;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .arch-column-header.firestorm {
            background: var(--firestorm-gradient);
        }

        .arch-column-header.icestorm {
            background: var(--icestorm-gradient);
        }

        .loading {
            text-align: center;
            padding: var(--spacing-3xl);
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-3xl);
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-lg);
        }

        @media (max-width: 768px) {
            .comparison-view {
                grid-template-columns: 1fr;
            }

            .instructions-table {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="brand-icon">🍎</span>
                <span class="brand-text">Apple CPU Research</span>
            </div>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="explorer.html" class="nav-link active">Explorer</a></li>
                <li><a href="visualizer.html" class="nav-link">Visualizer</a></li>
                <li><a href="../firestorm.html" class="nav-link">Documentation</a></li>
                <li>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                        <span class="theme-icon">🌙</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="explorer-container">
        <div class="explorer-header">
            <h1 class="explorer-title">
                <span class="gradient-text">Instruction Explorer</span>
            </h1>
            <p class="section-subtitle">
                Search and compare ARM64 instructions across Firestorm and Icestorm architectures
            </p>
        </div>

        <!-- Search Controls -->
        <div class="search-controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput"
                    placeholder="Search instructions (e.g., ADD, MUL, LDR)..."
                    autocomplete="off"
                >
            </div>

            <div class="filter-group">
                <div class="filter-item">
                    <label class="filter-label">Architecture</label>
                    <select class="filter-select" id="archFilter">
                        <option value="all">All Architectures</option>
                        <option value="firestorm">Firestorm (P-Core)</option>
                        <option value="icestorm">Icestorm (E-Core)</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label class="filter-label">Category</label>
                    <select class="filter-select" id="categoryFilter">
                        <option value="all">All Categories</option>
                        <option value="integer">Integer</option>
                        <option value="simd">SIMD/FP</option>
                        <option value="load-store">Load/Store</option>
                        <option value="branch">Branch</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label class="filter-label">Performance</label>
                    <select class="filter-select" id="perfFilter">
                        <option value="all">All Performance</option>
                        <option value="excellent">Excellent (≤1 cycle)</option>
                        <option value="good">Good (2-3 cycles)</option>
                        <option value="moderate">Moderate (4-10 cycles)</option>
                        <option value="slow">Slow (>10 cycles)</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label class="filter-label">View Mode</label>
                    <select class="filter-select" id="viewMode">
                        <option value="table">Table View</option>
                        <option value="comparison">Comparison View</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Results Header -->
        <div class="results-header">
            <div class="results-count" id="resultsCount">
                Loading instructions...
            </div>
        </div>

        <!-- Instructions Table -->
        <div id="instructionsContainer">
            <div class="loading">
                <div style="font-size: 3rem; margin-bottom: var(--spacing-lg);">⏳</div>
                <p>Loading instruction data...</p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/data-parser.js"></script>
    <script src="js/explorer.js"></script>
</body>
</html>
